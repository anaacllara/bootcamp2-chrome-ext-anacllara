name: CI

on: 
  push: 
    branches: [main]
  pull_request: 
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4 
        with: 
          node-version: '20'
          cache: 'npm'
        working-directory: ./chrome-ext

      - name: Instalar dependências
        run: npm ci 
        working-directory: ./chrome-ext

      - name: Instalar Playwright (Chromium + deps)
        run: npx playwright install --with-deps chromium 
        working-directory: ./chrome-ext

      - name: Build extensão 
        run: npm run build
        working-directory: ./chrome-ext

      - name: Teste E2E
        run: xvfb-run -a npm run teste:E2E
        working-directory: ./chrome-ext

      - name: Publicar relatório HTML do teste
        if: always()
        uses: actions/upload-artifact@v4
        with: 
          name: playwright-report
          path: chrome-ext/playwright-report

      - name: Publicar o pacote da extensão (ZIP) 
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip 
          path: chrome-ext/dist/extension.zip